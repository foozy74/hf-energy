<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3B2E"/>
      <stop offset="100%" stop-color="#071B14"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144838" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#09281F" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base for High Contrast on both Dark and Light Browser Tabs -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#C8F169" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Centered Leaf & Grid Veins (Corporate Design Energiezelle) -->
  <g transform="translate(32, 32) scale(0.9) translate(-22.5, -30)">
    <!-- Outer Leaf Silhouette -->
    <path
      d="M22.5 3 C10 16, 4 28, 4 40 C4 51, 12 57, 22.5 57 C33 57, 41 51, 41 40 C41 28, 35 16, 22.5 3 Z"
      fill="url(#leafGrad)"
      stroke="#C8F169"
      stroke-width="2.7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Central Stem -->
    <path
      d="M22.5 14 L22.5 54"
      stroke="#C8F169"
      stroke-width="2.5"
      stroke-linecap="round"
    />

    <!-- Upper Circuit Branch Left -->
    <path
      d="M22.5 25 L12 21"
      stroke="#C8F169"
      stroke-width="2.3"
      stroke-linecap="round"
    />
    <!-- Upper Circuit Branch Right -->
    <path
      d="M22.5 25 L33 21"
      stroke="#C8F169"
      stroke-width="2.3"
      stroke-linecap="round"
    />

    <!-- Mid Circuit Branch Left with 90-degree Grid Trace -->
    <path
      d="M22.5 36 L15 36 L15 31 L8 31"
      stroke="#C8F169"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Mid Circuit Branch Right with 90-degree Grid Trace -->
    <path
      d="M22.5 36 L30 36 L30 31 L37 31"
      stroke="#C8F169"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Lower Circuit Loop / Bus Node Left -->
    <path
      d="M22.5 45 L15 45 C11 45, 11 39, 15 39"
      stroke="#C8F169"
      stroke-width="2.3"
      stroke-linecap="round"
    />

    <!-- Lower Circuit Loop / Bus Node Right -->
    <path
      d="M22.5 45 L30 45 C34 45, 34 39, 30 39"
      stroke="#C8F169"
      stroke-width="2.3"
      stroke-linecap="round"
    />

    <!-- Glowing Center Node Point -->
    <circle cx="22.5" cy="36" r="4.2" fill="#C8F169" fill-opacity="0.35"/>
    <circle cx="22.5" cy="36" r="2.3" fill="#FAF1E8"/>
  </g>
</svg>
